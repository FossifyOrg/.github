name: Merge pull requests

on:
  schedule:
    - cron: "30 5 * * 6"
  workflow_dispatch:
    inputs:
      repository:
        description: "Merge PR in a specific repo or all"
        required: true
        default: "all"
        type: choice
        options:
          - "all"
          - "FossifyOrg/Calculator"
          - "FossifyOrg/Calendar"
          - "FossifyOrg/Camera"
          - "FossifyOrg/Clock"
          - "FossifyOrg/Contacts"
          - "FossifyOrg/Documents"
          - "FossifyOrg/File-Manager"
          - "FossifyOrg/Gallery"
          - "FossifyOrg/Keyboard"
          - "FossifyOrg/Launcher"
          - "FossifyOrg/Messages"
          - "FossifyOrg/Music-Player"
          - "FossifyOrg/Notes"
          - "FossifyOrg/Paint"
          - "FossifyOrg/Phone"
          - "FossifyOrg/Thank-You"
          - "FossifyOrg/Voice-Recorder"
      branch:
        description: "Branch name to merge"
        required: true
        default: "fossifybot/release"
        type: string
      merge_method:
        description: "Merge method"
        required: true
        default: "squash"
        type: choice
        options:
          - "squash"
          - "merge"
          - "rebase"
      force_admin:
        description: "Bypass branch protection (dangerous)"
        required: false
        default: false
        type: boolean
      pr_author:
        description: "Required PR author"
        required: false
        default: "fossifybot[bot]"
        type: string

concurrency:
  group: "merge-pull-requests"
  cancel-in-progress: false

jobs:
  merge:
    if: github.event_name != 'schedule' || vars.AUTO_MERGE_RELEASES == 'true'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.PERSONAL_TOKEN }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1
        with:
          egress-policy: audit

      - name: Check release Saturday
        id: cadence
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" != "schedule" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            days=$(( ($(date -u +%s) - $(date -u -d 2026-09-26 +%s)) / 86400 ))
            if (( days % 14 == 0 )); then
              echo "run=true" >> "$GITHUB_OUTPUT"
            else
              echo "Not a release Saturday; skipping." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

      - name: Merge pull requests
        if: steps.cadence.outputs.run == 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
          SELECTED_REPO: ${{ inputs.repository || 'all' }}
          BRANCH: ${{ inputs.branch || 'fossifybot/release' }}
          MERGE_METHOD: ${{ inputs.merge_method || 'squash' }}
          FORCE_ADMIN: ${{ inputs.force_admin || false }}
          PR_AUTHOR: ${{ github.event_name == 'schedule' && 'fossifybot[bot]' || inputs.pr_author }}
        run: |
          set -uo pipefail

          AUTO_MERGE_REPOS=(
              "FossifyOrg/Calendar"
          )

          REPOS=(
              "FossifyOrg/Calculator"
              "FossifyOrg/Calendar"
              "FossifyOrg/Camera"
              "FossifyOrg/Clock"
              "FossifyOrg/Contacts"
              "FossifyOrg/Documents"
              "FossifyOrg/File-Manager"
              "FossifyOrg/Gallery"
              "FossifyOrg/Keyboard"
              "FossifyOrg/Launcher"
              "FossifyOrg/Messages"
              "FossifyOrg/Music-Player"
              "FossifyOrg/Notes"
              "FossifyOrg/Paint"
              "FossifyOrg/Phone"
              "FossifyOrg/Thank-You"
              "FossifyOrg/Voice-Recorder"
          )

          case "$MERGE_METHOD" in
              squash) MERGE_FLAG="--squash" ;;
              merge) MERGE_FLAG="--merge"  ;;
              rebase) MERGE_FLAG="--rebase" ;;
              *)
                  echo "Invalid merge_method: $MERGE_METHOD"
                  exit 1
              ;;
          esac

          if [[ "$FORCE_ADMIN" == "true" ]]; then
              ADMIN_FLAG="--admin"
          else
              ADMIN_FLAG="--auto"
          fi

          if [[ "$EVENT_NAME" == "schedule" ]]; then
              REPOS=("${AUTO_MERGE_REPOS[@]}")
              echo "Processing scheduled repositories (${#REPOS[@]} repos)"
          elif [[ "$SELECTED_REPO" != "all" ]]; then
              REPOS=("$SELECTED_REPO")
              echo "Processing single repository: $SELECTED_REPO"
          else
              echo "Processing all repositories (${#REPOS[@]} repos)"
          fi

          SEARCH_ARGS=()
          if [[ -n "$PR_AUTHOR" ]]; then
              SEARCH_ARGS+=(--search "author:$PR_AUTHOR")
          fi

          for repo in "${REPOS[@]}"; do
              echo "Processing: $repo"
              
              PR_NUMBER=$(gh pr list --repo "$repo" --head "$BRANCH" "${SEARCH_ARGS[@]}" --json number --jq '.[0].number // empty')
              if [[ -z "$PR_NUMBER" ]]; then
                  echo "[$repo]: No open PR found for branch $BRANCH (author filter: '${PR_AUTHOR:-any}'). Skipping."
                  continue
              fi
              
              echo "[$repo]: Found PR #$PR_NUMBER for branch $BRANCH"

              if gh pr review --repo "$repo" --approve "$PR_NUMBER"; then
                  echo "[$repo]: PR #$PR_NUMBER approved"
              else
                  echo "[$repo]: Failed to approve PR #$PR_NUMBER"
              fi
              
              if gh pr merge --repo "$repo" "$MERGE_FLAG" "$ADMIN_FLAG" "$PR_NUMBER"; then
                  echo "[$repo]: PR #$PR_NUMBER merge submitted" | tee -a "$GITHUB_STEP_SUMMARY"
              else
                  echo "[$repo]: PR #$PR_NUMBER could not be merged. Skipping." | tee -a "$GITHUB_STEP_SUMMARY"
              fi
              
              sleep 1
          done

          echo "Done processing all repositories."
